name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Documentation checks
        run: |
          npm run docs:lint
          npm run docs:manifest:check
          npm run docs:llms:check
          npm run docs:context:check
      - name: Basic content checks
        run: |
          npm run home:content:check
          npm run training:content:check
          npm run enterprise:content:check
          npm run solutions:content:check
          npm run showcase:check
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: |
          npm run preview:local > /tmp/vane-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4328/api/demo-status; then break; fi
            sleep 1
          done
          npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: .tmp-visual-check/
          if-no-files-found: ignore
