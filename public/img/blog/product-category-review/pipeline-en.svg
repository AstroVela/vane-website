<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="1000" viewBox="0 0 2350 1000" role="img" aria-label="Assisted product category review workflow"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1 L10 6 L2 11" fill="none" stroke="#111111" stroke-width="2"/></marker></defs><rect width="2350" height="1000" fill="white"/><g font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif"><text x="80" y="106" font-size="66" font-weight="700" fill="#111111">Assisted Product Category Review</text><text x="82" y="164" font-size="32" font-weight="400" fill="#50565E">Vane Data + Lance  ·  From one confirmed mistake to more review candidates</text><rect x="610" y="218" width="1090" height="430" rx="30" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" stroke-dasharray="10 8"/><text x="640" y="264" font-size="30" font-weight="600" fill="#111111">Vane Data · Embeddings and structured audit</text><rect x="80" y="300" width="470" height="310" rx="24" fill="#DCEEFF" stroke="#111111" stroke-width="2.5"/><rect x="640" y="300" width="470" height="310" rx="24" fill="#EDE4FF" stroke="#111111" stroke-width="2.5"/><rect x="1200" y="300" width="470" height="310" rx="24" fill="#EDE4FF" stroke="#111111" stroke-width="2.5"/><rect x="1760" y="300" width="510" height="310" rx="24" fill="#FFF1C7" stroke="#111111" stroke-width="2.5"/><text x="110" y="349" font-size="25" font-weight="500" fill="#50565E">01</text><text x="165" y="350" font-size="35" font-weight="600" fill="#111111">Product content</text><text x="670" y="349" font-size="25" font-weight="500" fill="#50565E">02</text><text x="725" y="350" font-size="35" font-weight="600" fill="#111111">Embeddings</text><text x="1230" y="349" font-size="25" font-weight="500" fill="#50565E">03</text><text x="1285" y="350" font-size="35" font-weight="600" fill="#111111">Model audit</text><text x="1790" y="349" font-size="25" font-weight="500" fill="#50565E">04</text><text x="1845" y="350" font-size="35" font-weight="600" fill="#111111">Human review</text><rect x="110" y="383" width="140" height="174" rx="16" fill="#D9F4F2" stroke="#111111" stroke-width="2.5"/><path d="M135 462 L151 412 L209 412 L225 462 Z M180 463 V521 M153 524 H207" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="278" y="420" font-size="28" font-weight="600" fill="#111111">Desk lamp</text><text x="278" y="460" font-size="26" font-weight="400" fill="#50565E">Listed under</text><rect x="278" y="481" width="220" height="48" rx="16" fill="#FFF1C7" stroke="#111111" stroke-width="2.5"/><text x="296" y="514" font-size="25" font-weight="500" fill="#111111">Light Bulb ?</text><text x="670" y="416" font-size="33" font-weight="600" fill="#111111">Jina CLIP v2</text><rect x="670" y="449" width="182" height="48" rx="16" fill="#DCEEFF" stroke="#111111" stroke-width="2.5"/><text x="688" y="482" font-size="25" font-weight="500" fill="#111111">Title vector</text><rect x="872" y="449" width="208" height="48" rx="16" fill="#D9F4F2" stroke="#111111" stroke-width="2.5"/><text x="890" y="482" font-size="25" font-weight="500" fill="#111111">Image vector</text><text x="670" y="551" font-size="26" font-weight="400" fill="#111111">1024 dimensions · pooled images</text><text x="1230" y="416" font-size="33" font-weight="600" fill="#111111">Gemini</text><text x="1230" y="462" font-size="27" font-weight="400" fill="#111111">Title + category + all images</text><rect x="1230" y="491" width="410" height="48" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="1248" y="524" font-size="25" font-weight="500" fill="#111111">Verdict · reason · suggestion</text><circle cx="1820" cy="423" r="25" fill="#DDF5D8" stroke="#111111" stroke-width="2.5"/><path d="M1808 423 L1817 433 L1835 412" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1865" y="432" font-size="29" font-weight="600" fill="#111111">Confirm the mismatch</text><text x="1790" y="491" font-size="25" font-weight="400" fill="#111111">Suggested: Light Bulb → Table Lamp</text><text x="1790" y="549" font-size="24" font-weight="400" fill="#111111">Use a confirmed mistake as the seed</text><path d="M550 455 H640" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1110 455 H1200" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1670 455 H1760" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="80" y="752" width="810" height="164" rx="24" fill="#F3F4F5" stroke="#111111" stroke-width="2.5"/><ellipse cx="141" cy="802" rx="27" ry="10" fill="white" stroke="#111111" stroke-width="2.5"/><path d="M114 802 V849 C114 863 168 863 168 849 V802 M114 825 C114 839 168 839 168 825" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="199" y="803" font-size="32" font-weight="600" fill="#111111">Lance · Storage and retrieval</text><text x="199" y="850" font-size="27" font-weight="400" fill="#111111">Listings / images / vectors / audit results</text><text x="199" y="888" font-size="26" font-weight="400" fill="#50565E">Keep the seed and rank for traceability</text><rect x="1060" y="752" width="1210" height="164" rx="24" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><circle cx="1123" cy="815" r="25" fill="#DCEEFF" stroke="#111111" stroke-width="2.5"/><path d="M1141 834 L1160 853" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1185" y="803" font-size="33" font-weight="600" fill="#111111">Lance · Similarity search</text><text x="1185" y="851" font-size="27" font-weight="400" fill="#111111">Title + image vectors → merge rankings → review candidates</text><text x="1185" y="889" font-size="26" font-weight="400" fill="#50565E">Similarity suggests candidates; it does not prove a mismatch</text><path d="M2015 610 V752" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="2050" y="690" font-size="25" font-weight="400" fill="#111111">Confirmed seed</text><path d="M1375 752 V699 H1435 V610" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1050" y="705" font-size="27" font-weight="500" fill="#111111">Audit candidates again</text></g></svg>