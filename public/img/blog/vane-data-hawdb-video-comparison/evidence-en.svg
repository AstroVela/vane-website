<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="800" viewBox="0 0 2350 800" role="img" aria-label="Trace both sides of a comparison back to the selected source versions">
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1 L10 6 L2 11" fill="none" stroke="#111111" stroke-width="2"/></marker></defs>
  <rect width="2350" height="800" fill="white"/>
  <g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#111111">
    <text x="80" y="106" font-size="60" font-weight="700">From a Comparison Back to the Source</text>
    <text x="82" y="164" font-size="30" fill="#50565E">Use each side's source version to recover the text, frame and playback position</text>
    <rect x="80" y="320" width="420" height="220" rx="24" fill="#DCEEFF" stroke="#111111" stroke-width="2.5"/>
    <text x="110" y="376" font-size="26" font-weight="600">Proposed comparison result</text>
    <text x="110" y="429" font-size="27">Application saves JSON</text>
    <text x="110" y="480" font-size="26">Source versions for A + B</text>
    <g stroke="#111111" stroke-width="2.5">
      <rect x="660" y="250" width="450" height="175" rx="24" fill="#DDF5D8"/>
      <rect x="660" y="465" width="450" height="175" rx="24" fill="#DDF5D8"/>
      <rect x="1240" y="250" width="450" height="175" rx="24" fill="#F3F4F5"/>
      <rect x="1240" y="465" width="450" height="175" rx="24" fill="#F3F4F5"/>
      <rect x="1820" y="250" width="450" height="175" rx="24" fill="#FFF1C7"/>
      <rect x="1820" y="465" width="450" height="175" rx="24" fill="#FFF1C7"/>
    </g>
    <text x="690" y="300" font-size="30" font-weight="600">A · Selected Run</text>
    <text x="690" y="350" font-size="26">HawDB source records</text>
    <text x="690" y="391" font-size="25" fill="#50565E">Version used for this result</text>
    <text x="690" y="515" font-size="30" font-weight="600">B · Selected Run</text>
    <text x="690" y="565" font-size="26">HawDB source records</text>
    <text x="690" y="606" font-size="25" fill="#50565E">Version used for this result</text>
    <text x="1270" y="300" font-size="30" font-weight="600">A · Original evidence</text>
    <text x="1270" y="350" font-size="26">Text + subtitle time range</text>
    <text x="1270" y="391" font-size="25" fill="#50565E">Or the original frame + time</text>
    <text x="1270" y="515" font-size="30" font-weight="600">B · Original evidence</text>
    <text x="1270" y="565" font-size="26">Text + subtitle time range</text>
    <text x="1270" y="606" font-size="25" fill="#50565E">Or the original frame + time</text>
    <text x="1850" y="300" font-size="30" font-weight="600">Review source A</text>
    <text x="1850" y="350" font-size="26">Play the cited clip</text>
    <text x="1850" y="391" font-size="25" fill="#50565E">Or inspect the saved image</text>
    <text x="1850" y="515" font-size="30" font-weight="600">Review source B</text>
    <text x="1850" y="565" font-size="26">Play the cited clip</text>
    <text x="1850" y="606" font-size="25" fill="#50565E">Or inspect the saved image</text>
    <g fill="none" stroke="#111111" stroke-width="3" marker-end="url(#arrow)">
      <path d="M500 430 H580 V338 H660"/><path d="M580 430 V553 H660"/>
      <path d="M1110 338 H1240"/><path d="M1110 553 H1240"/>
      <path d="M1690 338 H1820"/><path d="M1690 553 H1820"/>
    </g>
    <text x="82" y="738" font-size="27" fill="#50565E">After reprocessing, historical results still refer to the source versions used when they were generated.</text>
  </g>
</svg>
