    <text x="1285" y="331" font-size="35" font-weight="600">Vane Data</text>
    <text x="1230" y="402" font-size="29" font-weight="600">Extract &amp; compare</text>
    <text x="1230" y="452" font-size="27">Statements + test conditions</text>
    <text x="1230" y="497" font-size="27">Structured model outputs</text>
    <rect x="1230" y="533" width="410" height="48" rx="16" fill="white" stroke="#111111" stroke-width="2.5"/>
    <text x="1248" y="566" font-size="24">Check comparability first</text>
