    <path d="M365 385 L389 400 L365 415 Z" fill="#111111"/>
    <text x="110" y="481" font-size="27">Subtitles + timestamped frames</text>
    <text x="110" y="525" font-size="26">Vane reads selected video frames</text>
    <text x="110" y="569" font-size="25" fill="#50565E">Application prepares OCR + JSONL</text>
