<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="660" viewBox="0 0 2160 660" role="img" aria-label="How a Jev call executes"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1 L10 6 L2 11" fill="none" stroke="#111111" stroke-width="2"/></marker></defs><rect width="2160" height="660" fill="white"/><g font-family="Arial, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><text x="80" y="106" font-size="60" font-weight="700" fill="#111111">How a Jev call executes</text><rect x="80" y="180" width="640" height="400" rx="24" fill="#DCEEFF" stroke="#111111" stroke-width="2.5"/><circle cx="138" cy="242" r="27" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="138" y="252" font-size="26" font-weight="600" fill="#111111" text-anchor="middle">1</text><text x="184" y="254" font-size="32" font-weight="600" fill="#111111">Build the plan</text><circle cx="112" cy="342" r="4" fill="#111111"/><text x="134" y="350" font-size="24" fill="#111111">Register questions, model, and credentials</text><rect x="134" y="405" width="218.6" height="46" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="150" y="436" font-size="22" font-weight="500" fill="#111111">No requests sent</text><rect x="780" y="180" width="640" height="400" rx="24" fill="#EDE4FF" stroke="#111111" stroke-width="2.5"/><circle cx="838" cy="242" r="27" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="838" y="252" font-size="26" font-weight="600" fill="#111111" text-anchor="middle">2</text><text x="884" y="254" font-size="32" font-weight="600" fill="#111111">Execute calls</text><circle cx="812" cy="342" r="4" fill="#111111"/><text x="834" y="350" font-size="24" fill="#111111">One client per executor,</text><circle cx="812" cy="384" r="4" fill="#111111"/><text x="834" y="392" font-size="24" fill="#111111">reused across batches</text><circle cx="812" cy="426" r="4" fill="#111111"/><text x="834" y="434" font-size="24" fill="#111111">One request per row,</text><circle cx="812" cy="468" r="4" fill="#111111"/><text x="834" y="476" font-size="24" fill="#111111">all five questions at once</text><text x="834" y="520" font-size="21" fill="#50565E">Concurrency cap:</text><text x="834" y="554" font-size="21" fill="#50565E">actor_number × max_concurrency_per_actor</text><rect x="1480" y="180" width="640" height="400" rx="24" fill="#DDF5D8" stroke="#111111" stroke-width="2.5"/><circle cx="1538" cy="242" r="27" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="1538" y="252" font-size="26" font-weight="600" fill="#111111" text-anchor="middle">3</text><text x="1584" y="254" font-size="32" font-weight="600" fill="#111111">Write results back</text><circle cx="1512" cy="342" r="4" fill="#111111"/><text x="1534" y="350" font-size="24" fill="#111111">Validate each response,</text><circle cx="1512" cy="384" r="4" fill="#111111"/><text x="1534" y="392" font-size="24" fill="#111111">write to the response column</text><circle cx="1512" cy="426" r="4" fill="#111111"/><text x="1534" y="434" font-size="24" fill="#111111">NULL rows skipped;</text><circle cx="1512" cy="468" r="4" fill="#111111"/><text x="1534" y="476" font-size="24" fill="#111111">failures follow on_error</text><path d="M720 380 L780 380" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1420 380 L1480 380" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/></g></svg>