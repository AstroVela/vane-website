="46" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="534" y="477" font-size="22" font-weight="500" fill="#111111">16 kHz mono</text><text x="518" y="532" font-size="22" fill="#111111">Check empty audio</text><text x="518" y="574" font-size="22" fill="#111111">and non-finite values</text><text x="518" y="616" font-size="22" fill="#111111">Failed rows keep error</text><rect x="876" y="320" width="350" height="400" rx="24" fill="#EDE4FF" stroke="#111111" stroke-width="2.5"/><text x="904" y="372" font-size="24" font-weight="500" fill="#50565E">03</text><text x="904" y="420" font-size="30" font-weight="600" fill="#111111">Whisper on GPU</text><rect x="904" y="446" width="265.2" height="46" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="920" y="477" font-size="22" font-weight="500" fill="#111111">faster-whisper-small</text><text x="904" y="532" font-size="22" fill="#111111">CUDA + FP16</text><text x="904" y="574" font-size="22" fill="#111111">VAD + word timestamps</text><rect x="1262" y="320" width="350" height="400" rx="24" fill="#EDE4FF" stroke="#111111" stroke-width="2.5"/><text x="1290" y="372" font-size="24" font-weight="500" fill="#50565E">04</text><text x="1290" y="420" font-size="30" font-weight="600" fill="#111111">Quality checks</text><rect x="1290" y="446" width="276.9" height="46" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="1306" y="477" font-size="22" font-weight="500" fill="#111111">Empty / repeated text</text><rect x="1290" y="500" width="195.2" height="46" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="1306" y="531" font-size="22" font-weight="500" fill="#111111">Bad timestamps</text><text x="1290" y="586" font-size="22" fill="#111111">Flagged as suspicious</text><rect x="1648" y="320" width="350" height="400" rx="24" fill="#FFF1C7" stroke="#111111" stroke-width="2.5"/><text x="1676" y="372" font-size="24" font-weight="500" fill="#50565E">05</text><text x="1676" y="4