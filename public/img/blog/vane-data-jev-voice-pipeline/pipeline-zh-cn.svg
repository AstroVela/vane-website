<svg xmlns="http://www.w3.org/2000/svg" width="2878" height="1000" viewBox="0 0 2878 1000" role="img" aria-label="银行语音分析流水线"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1 L10 6 L2 11" fill="none" stroke="#111111" stroke-width="2"/></marker></defs><rect width="2878" height="1000" fill="white"/><g font-family="Arial, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><text x="80" y="106" font-size="64" font-weight="700" fill="#111111">银行语音分析流水线</text><text x="82" y="164" font-size="31" fill="#50565E">Vane Data + Jev · 从一段录音到可复核的业务字段</text><rect x="466" y="248" width="1942" height="496" rx="30" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="10 8"/><text x="490" y="296" font-size="27" font-weight="600" fill="#111111">Vane Data · 同一条 Relation 查询计划</text><rect x="80" y="320" width="350" height="400" rx="24" fill="#DCEEFF" stroke="#111111" stroke-width="2.5"/><text x="108" y="372" font-size="24" font-weight="500" fill="#50565E">01</text><text x="108" y="420" font-size="30" font-weight="600" fill="#111111">录音输入</text><rect x="108" y="446" width="213.3" height="46" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="124" y="477" font-size="22" font-weight="500" fill="#111111">Parquet 中文录音</text><text x="108" y="532" font-size="22" fill="#111111">MInDS-14 zh-CN</text><text x="108" y="574" font-size="22" fill="#111111">固定 revision</text><text x="108" y="616" font-size="22" fill="#111111">502 条 · 评测取 112 条</text><rect x="490" y="320" width="350" height="400" rx="24" fill="#EDE4FF" stroke="#111111" stroke-width="2.5"/><text x="518" y="372" font-size="24" font-weight="500" fill="#50565E">02</text><text x="518" y="420" font-size="30" font-weight="600" fill="#111111">解码与重采样</text><rect x="518" y="446" width="179.6" height="46" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="534" y="477" font-size="22" font-weight="500" fill="#111111">16 kHz 单声道</text><text x="518" y="532" font-size="22" fill="#111111">检查空音频与非有限数值</text><text x="518" y="574" font-size="22" fill="#111111">失败行保留 error 继续流转</text><rect x="876" y="320" width="350" height="400" rx="24" fill="#EDE4FF" stroke="#111111" stroke-width="2.5"/><text x="904" y="372" font-size="24" font-weight="500" fill="#50565E">03</text><text x="904" y="420" font-size="30" font-weight="600" fill="#111111">GPU Whisper 转写</text><rect x="904" y="446" width="265.2" height="46" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="920" y="477" font-size="22" font-weight="500" fill="#111111">faster-whisper-small</text><text x="904" y="532" font-size="22" fill="#111111">CUDA + FP16</text><text x="904" y="574" font-size="22" fill="#111111">VAD 过滤 + 词级时间戳</text><rect x="1262" y="320" width="350" height="400" rx="24" fill="#EDE4FF" stroke="#111111" stroke-width="2.5"/><text x="1290" y="372" font-size="24" font-weight="500" fill="#50565E">04</text><text x="1290" y="420" font-size="30" font-weight="600" fill="#111111">质量检查</text><rect x="1290" y="446" width="221.0" height="46" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="1306" y="477" font-size="22" font-weight="500" fill="#111111">空转写 / 异常重复</text><rect x="1290" y="500" width="208.0" height="46" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="1306" y="531" font-size="22" font-weight="500" fill="#111111">时间戳越界或乱序</text><text x="1290" y="586" font-size="22" fill="#111111">命中即标记为可疑</text><rect x="1648" y="320" width="350" height="400" rx="24" fill="#FFF1C7" stroke="#111111" stroke-width="2.5"/><text x="1676" y="372" font-size="24" font-weight="500" fill="#50565E">05</text><text x="1676" y="420" font-size="30" font-weight="600" fill="#111111">Jev 结构化判断</text><rect x="1676" y="446" width="148.6" height="46" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="1692" y="477" font-size="22" font-weight="500" fill="#111111">jev-1.13.0</text><text x="1676" y="532" font-size="22" fill="#111111">5 个结构化问题</text><text x="1676" y="574" font-size="22" fill="#111111">4 Actor × 并发 8</text><rect x="2034" y="320" width="350" height="400" rx="24" fill="#EDE4FF" stroke="#111111" stroke-width="2.5"/><text x="2062" y="372" font-size="24" font-weight="500" fill="#50565E">06</text><text x="2062" y="420" font-size="30" font-weight="600" fill="#111111">SQL 字段整理</text><text x="2062" y="490" font-size="22" fill="#111111">意图 / 队列</text><text x="2062" y="532" font-size="22" fill="#111111">紧急程度 / 不满程度</text><text x="2062" y="574" font-size="22" fill="#111111">needs_human</text><text x="2062" y="616" font-size="22" fill="#111111">review_reason</text><rect x="2448" y="320" width="350" height="400" rx="24" fill="#DDF5D8" stroke="#111111" stroke-width="2.5"/><text x="2476" y="372" font-size="24" font-weight="500" fill="#50565E">07</text><text x="2476" y="420" font-size="30" font-weight="600" fill="#111111">输出</text><rect x="2476" y="446" width="206.9" height="46" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="2492" y="477" font-size="22" font-weight="500" fill="#111111">results.parquet</text><rect x="2476" y="500" width="148.6" height="46" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="2492" y="531" font-size="22" font-weight="500" fill="#111111">review.csv</text><text x="2476" y="586" font-size="22" fill="#111111">全部 review_required</text><text x="2476" y="628" font-size="22" fill="#111111">导出供人工复核</text><path d="M430 520 L466 520" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M2408 520 L2448 520" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M840 520 L876 520" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1226 520 L1262 520" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" marker-end="url(#