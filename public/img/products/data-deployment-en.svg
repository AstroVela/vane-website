<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
  <title>Local and Ray deployment</title><title>从本地开发到分布式执行</title>
  <desc>同一份 SQL 或 Python 处理定义，可交给一台机器上的 Local Runner，或单机 Ray 与多机 Ray 集群执行。Local Runner 可使用本机子进程；Ray 调度 CPU Worker 和可复用模型实例的 GPU Actor。分布式执行要求所有 Worker 可访问数据、模型、依赖和输出。</desc>

  <rect x="0" y="0" width="1400" height="650" fill="#FAFAF7" />


  <text x="700" y="32" text-anchor="middle" fill="#20251F" font-family="Arial, Noto Sans SC, sans-serif" font-size="24.0" font-weight="600">One processing definition</text>
  <rect x="238" y="54" width="924" height="64" rx="10" fill="#FFFFFF" stroke="#D3D8CC" stroke-width="1.5" />
  <g fill="#20251F" font-family="Arial, Noto Sans SC, sans-serif" font-size="22" text-anchor="middle">
    <text x="326" y="94" font-size="22.0">Read</text>
    <text x="549" y="94" font-size="22.0">Prepare / UDF</text>
    <text x="784" y="94" font-size="22.0">AI inference</text>
    <text x="1030" y="94" font-size="22.0">Query &amp; write</text>
  </g>
  <g fill="none" stroke="#8D9688" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M396 86 H441 M433 79 L441 86 L433 93" />
    <path d="M658 86 H702 M694 79 L702 86 L694 93" />
    <path d="M874 86 H917 M909 79 L917 86 L909 93" />
  </g>
  <text x="700" y="146" text-anchor="middle" fill="#65705E" font-family="Arial, Noto Sans SC, sans-serif" font-size="18.0">The same SQL / Python logic</text>


  <g fill="none" stroke="#9CA593" stroke-width="1.8" stroke-linejoin="round">
    <polyline points="700,157 700,182 350,182 350,211" />
    <polyline points="700,182 1045,182 1045,211" />
  </g>
