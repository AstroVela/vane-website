  <path d="M78 248 h22 v-17 h-22 z M83 253 h12 M89 248 v5" fill="none" stroke="#65705E" stroke-width="1.8" stroke-linejoin="round" />
  <text x="116" y="246" fill="#20251F" font-family="Arial, Noto Sans SC, sans-serif" font-size="23.0" font-weight="600">One machine · Local Runner</text>
  <text x="78" y="278" fill="#65705E" font-family="Arial, Noto Sans SC, sans-serif" font-size="18.0">No Ray · One worker by default</text>

  <rect x="89" y="328" width="210" height="88" rx="8" fill="#FFFFFF" stroke="#C9D1C1" stroke-width="1.5" />
  <g fill="#20251F" font-family="Arial, Noto Sans SC, sans-serif" text-anchor="middle">
